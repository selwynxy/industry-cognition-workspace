<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>行业认知简报系统</title>
<!-- 单文件 / 零外链 / 数据存于浏览器 localStorage / 简报内容由 WorkBuddy 供稿 -->
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e5e9ef; --line2:#eef1f5;
  --ink:#1a2434; --ink2:#566377; --ink3:#95a0b2;
  --navy:#1e3a5f; --navy-d:#152b48; --blue:#2563eb; --blue-l:#eef4ff;
  --teal:#0d9488; --teal-l:#eefbf8; --amber:#b45309; --amber-l:#fff7ed;
  --violet:#6d28d9; --violet-l:#f5f3ff; --rose:#be123c; --rose-l:#fff1f2;
  --green:#15803d; --green-l:#f0fdf4;
  --r:14px; --rs:10px; --sh:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue);text-decoration:none}
svg{display:block}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 130px}

/* topbar */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 12px rgba(30,58,95,.18)}
.topbar-in{max-width:1000px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
.logo svg{width:21px;height:21px}
.brand-t{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand-s{font-size:11.5px;color:#a9c2dd}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill-profile{font-size:12px;background:rgba(255,255,255,.12);padding:6px 11px;border-radius:99px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-date{font-size:11.5px;color:#a9c2dd;white-space:nowrap}

/* tabs */
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:5px;margin:18px 0 16px;box-shadow:var(--sh)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:45px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);transition:.16s}
.tab svg{width:17px;height:17px}
.tab:hover{background:var(--bg)}
.tab.active{background:var(--navy);color:#fff}
.tab.active svg{stroke:#fff}

.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* common */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.sec{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.sec h2{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.sec h2 svg{width:18px;height:18px;color:var(--navy)}
.sec .sub{font-size:12px;color:var(--ink3);font-weight:400}
.sec .right{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:600;transition:.16s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-g{background:#fff;border-color:var(--line);color:var(--ink2)}
.btn-g:hover{border-color:#c9d2de;color:var(--ink)}
.btn-p{background:var(--navy);color:#fff}
.btn-p:hover{background:var(--navy-d)}
.btn-sm{min-height:34px;padding:0 10px;font-size:12.5px;border-radius:7px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.chip.blue{background:var(--blue-l);color:var(--blue);border-color:#dbe7ff}
.chip.teal{background:var(--teal-l);color:var(--teal);border-color:#cceeda}
.chip.violet{background:var(--violet-l);color:var(--violet);border-color:#e5ddff}
.chip.amber{background:var(--amber-l);color:var(--amber);border-color:#ffedd5}
.chip.rose{background:var(--rose-l);color:var(--rose);border-color:#ffe0e6}
.chip.green{background:var(--green-l);color:var(--green);border-color:#dcfce7}
.muted{color:var(--ink3)}
.empty{text-align:center;padding:40px 16px;color:var(--ink3)}
.empty svg{width:40px;height:40px;opacity:.45;margin:0 auto 10px}

/* day/week switch */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{min-height:34px;padding:0 15px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(16,24,40,.1)}

/* insight card */
.brief{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.brief-hd{padding:16px 18px 0}
.brief-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.score{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--navy);background:var(--blue-l);padding:3px 9px;border-radius:99px}
.brief-title{font-size:16.5px;font-weight:750;line-height:1.45;margin:0 0 9px;letter-spacing:.1px}
.oneliner{font-size:14px;color:var(--ink);background:linear-gradient(90deg,#f8fafc,#fff);border-left:3px solid var(--navy);padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:10px}
.why{font-size:11.5px;color:var(--violet);background:var(--violet-l);border-radius:6px;padding:5px 9px;display:inline-flex;gap:5px;align-items:center;margin-bottom:10px}
.why svg{width:13px;height:13px}
.brief-body{padding:0 18px}
.detail{border-top:1px solid var(--line2);padding:11px 0}
.detail-lbl{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.5px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.detail-lbl svg{width:13px;height:13px}
.findings{margin:0;padding-left:17px;font-size:13.3px;color:var(--ink2)}
.findings li{margin:3px 0}
.impact-txt,.action-txt{font-size:13.3px;color:var(--ink2);margin:0}
.action-txt{color:var(--ink)}
.evidence{background:var(--bg);border-radius:8px;padding:9px 11px;font-size:11.8px;color:var(--ink2);margin-top:4px}
.evidence a{font-weight:600;word-break:break-all}
.conf{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px}
.conf.hi{background:var(--green-l);color:var(--green)}
.conf.md{background:var(--amber-l);color:var(--amber)}
.brief-ft{padding:12px 18px;background:#fbfcfd;border-top:1px solid var(--line2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fb{min-height:32px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:4px}
.fb svg{width:13px;height:13px}
.fb:hover{border-color:#c9d2de}
.fb.on-useful{background:var(--green-l);color:var(--green);border-color:#bbf7d0}
.fb.on-deep{background:var(--blue-l);color:var(--blue);border-color:#bfdbfe}
.fb.on-irrelevant{background:var(--rose-l);color:var(--rose);border-color:#fecdd3}
.fb.on-save{background:var(--amber-l);color:var(--amber);border-color:#fed7aa}
.ft-right{margin-left:auto;display:flex;align-items:center;gap:5px}
.note-toggle{font-size:12px;color:var(--blue);font-weight:600;cursor:pointer}
.note-box{display:none;padding:0 18px 14px}
.note-box.show{display:block}
.note-box textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;resize:vertical;outline:none}
.note-box textarea:focus{border-color:var(--blue)}

/* knowledge */
.kb-track{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.kb-tab{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line)}
.kb-tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.concept{border:1px solid var(--line);border-radius:var(--rs);padding:13px 14px;margin-bottom:10px;background:#fff}
.concept-hd{display:flex;align-items:flex-start;gap:9px}
.concept-name{font-size:14.5px;font-weight:700;flex:1}
.concept-def{font-size:13.2px;color:var(--ink2);margin-top:6px}
.concept-why{font-size:12.5px;color:var(--teal);background:var(--teal-l);border-radius:6px;padding:6px 9px;margin-top:8px}
.mastery{width:26px;height:26px;border-radius:7px;border:2px solid #cbd5e1;flex:none;display:flex;align-items:center;justify-content:center}
.mastery svg{width:14px;height:14px;color:#fff;opacity:0}
.mastery.done{background:var(--green);border-color:var(--green)}
.mastery.done svg{opacity:1}
.timeline-item{display:flex;gap:12px;padding:0 0 16px}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--navy);flex:none;margin-top:6px;box-shadow:0 0 0 4px var(--blue-l)}
.tl-date{font-size:11.5px;color:var(--ink3);font-weight:600;margin-bottom:3px}
.tl-title{font-size:14px;font-weight:650}

/* profile */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;background:#fff}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.field .hint{font-size:11px;color:var(--ink3);margin-top:4px}
.focus-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:var(--blue-l);color:var(--blue);padding:5px 10px;border-radius:99px;margin:0 6px 6px 0}
.focus-tag b{cursor:pointer;font-size:14px;line-height:1}
.pref-row{display:flex;gap:8px;flex-wrap:wrap}
.pref-opt{padding:8px 13px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;background:#fff}
.pref-opt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.explain{background:var(--violet-l);border:1px solid #e5ddff;border-radius:10px;padding:13px 15px;font-size:12.8px;color:#4c1d95}
.explain b{display:block;margin-bottom:5px}

/* review */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:13px;text-align:center}
.stat .n{font-size:24px;font-weight:800;line-height:1.1;color:var(--navy)}
.stat .l{font-size:11.5px;color:var(--ink3);margin-top:3px}
.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:12.5px}
.bar-row .lbl{width:88px;flex:none;color:var(--ink2);font-weight:600}
.bar-track{flex:1;height:10px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .5s}
.bar-row .v{width:34px;text-align:right;font-weight:700;color:var(--ink2)}
.learn-note{font-size:12.5px;color:var(--ink2);background:var(--amber-l);border-radius:8px;padding:10px 12px;margin-top:6px}

/* modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.44);z-index:90;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
@media(min-width:769px){.overlay.show{align-items:center}}
.drawer{background:#fff;width:100%;max-width:620px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + var(--safe));max-height:92vh;overflow-y:auto;animation:up .25s ease}
@media(min-width:769px){.drawer{border-radius:18px}}
@keyframes up{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
.drawer h2{margin:0 0 16px;font-size:18px}
.drawer-acts{display:flex;gap:10px;margin-top:18px}
.drawer-acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe));transform:translateX(-50%) translateY(16px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:120;opacity:0;pointer-events:none;transition:.26s;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footnote{text-align:center;font-size:11px;color:var(--ink3);padding:6px 0 16px}

/* responsive */
@media(max-width:860px){.stat-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .wrap{padding:0 12px 120px}
  .topbar-in{padding:11px 12px}
  .brand-t{font-size:14.5px}.pill-date{display:none}
  .pill-profile{font-size:11px;max-width:130px}
  .tabs{position:fixed;left:0;right:0;bottom:0;border-radius:0;margin:0;border:none;border-top:1px solid var(--line);padding:5px 5px calc(5px + var(--safe));z-index:45;box-shadow:0 -2px 14px rgba(16,24,40,.06)}
  .tab{flex-direction:column;gap:2px;min-height:50px;font-size:10.5px}
  .tab svg{width:19px;height:19px}
  .sec .right{width:100%;margin-left:0}
  .brief-title{font-size:15.5px}
  .fb{flex:1;justify-content:center;min-width:0}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></div>
    <div>
      <div class="brand-t">行业认知简报</div>
      <div class="brand-s" id="brand-sub">跟进 · 总结 · 反馈 · 推荐</div>
    </div>
    <div class="hdr-right">
      <span class="pill-profile" id="pill-profile"></span>
      <span class="pill-date" id="pill-date"></span>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="briefs" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>认知简报</button>
    <button class="tab" data-tab="knowledge" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>知识体系</button>
    <button class="tab" data-tab="profile" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的画像</button>
    <button class="tab" data-tab="review" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>闭环复盘</button>
  </nav>

  <!-- 认知简报 -->
  <section class="view active" id="view-briefs">
    <div class="card" style="padding:14px 16px">
      <div class="sec" style="margin-bottom:10px">
        <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="brief-heading">今日重点</span></h2>
        <div class="right">
          <div class="seg"><button data-horizon="daily" class="on">按日</button><button data-horizon="weekly">按周</button></div>
        </div>
      </div>
      <div id="brief-summary" style="font-size:12.5px;color:var(--ink2)"></div>
    </div>
    <div id="brief-list"></div>
  </section>

  <!-- 知识体系 -->
  <section class="view" id="view-knowledge">
    <div class="card">
      <div class="sec"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/></svg>基础 × 前沿 双轨</h2><span class="sub">扎实基础 + 前沿动态</span></div>
      <div class="kb-track" id="kb-track">
        <button class="kb-tab on" data-kb="foundation">基础知识体系</button>
        <button class="kb-tab" data-kb="frontier">前沿动态追踪</button>
      </div>
      <div id="kb-panel"></div>
    </div>
  </section>

  <!-- 我的画像 -->
  <section class="view" id="view-profile">
    <div class="card">
      <div class="sec"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>个人画像与学习偏好</h2></div>
      <form id="profile-form">
        <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
          <div class="field"><label>所在行业</label><input name="industry" id="pf-industry" placeholder="如：医疗健康 / 康复医学"></div>
          <div class="field"><label>岗位 / 角色</label><input name="role" id="pf-role" placeholder="如：医生 / 大学教授"></div>
        </div>
        <div class="field"><label>学习目标</label><textarea name="goal" id="pf-goal" placeholder="你想通过这套简报达成什么？"></textarea></div>
        <div class="field"><label>关注领域（用逗号分隔，决定推荐匹配）</label><input name="focus" id="pf-focus" placeholder="脑机接口, 卒中康复, 认知障碍"><div class="hint">简报会标注"为什么推荐给你"，即命中的关注领域</div></div>
        <div class="field"><label>内容深度偏好</label><div class="pref-row" id="pref-depth">
          <span class="pref-opt" data-v="concise">简明摘要</span><span class="pref-opt" data-v="balanced">摘要+要点</span><span class="pref-opt" data-v="deep">深度完整</span>
        </div></div>
        <div class="field"><label>阅读节奏</label><div class="pref-row" id="pref-pace">
          <span class="pref-opt" data-v="daily">每日简报</span><span class="pref-opt" data-v="weekly">每周汇总</span>
        </div></div>
        <div class="drawer-acts"><button type="submit" class="btn btn-p">保存画像</button><button type="button" class="btn btn-g" data-action="export">导出备份</button><button type="button" class="btn btn-g" data-action="import">导入备份</button></div>
      </form>
      <div class="explain" style="margin-top:16px" id="profile-explain"></div>
    </div>
    <div class="card">
      <div class="sec"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>从你的反馈中学到的偏好</h2></div>
      <div id="learned-prefs"></div>
    </div>
  </section>

  <!-- 闭环复盘 -->
  <section class="view" id="view-review">
    <div class="stat-row" id="stat-row"></div>
    <div class="card">
      <div class="sec"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>反馈分布</h2><span class="sub">你的互动如何重塑推荐</span></div>
      <div id="feedback-chart"></div>
    </div>
    <div class="card">

  if(!Array.isArray(state.briefs)||!state.briefs.length)state.briefs=d.briefs;
  if(!Array.isArray(state.concepts)||!state.concepts.length)state.concepts=d.concepts;
  if(!Array.isArray(state.feedbackLog))state.feedbackLog=[];
  if(!state.tagWeights)state.tagWeights={};
  if(!state.ui)state.ui=d.ui;
}

/* ============ 计算层：真实反馈驱动的推荐 ============ */
/* 标签权重 = 基础关注 + 反馈累积。useful +3 / deep +2 / neutral +0 / irrelevant -3 */
function effectiveScore(b){
  var focus=state.profile.focus||[]; var w=state.tagWeights||{};
  var s=b.baseValue||0;
  (b.tags||[]).forEach(function(t){
    var base=focus.indexOf(t)>=0?6:0;
    s += base + (w[t]||0);
  });
  // 未读微加权，避免已读长期占据顶部
  if(b.feedback==='useful'||b.feedback==='deep')s-=2;
  return Math.round(s);
}
function rankBriefs(list){
  return list.slice().sort(function(a,b){return effectiveScore(b)-effectiveScore(a)});
}
function matchTags(b){
  var focus=state.profile.focus||[];
  return (b.tags||[]).filter(function(t){return focus.indexOf(t)>=0});
}
function applyFeedback(briefId,action){
  var b=null;for(var i=0;i<state.briefs.length;i++)if(state.briefs[i].id===briefId){b=state.briefs[i];break}
  if(!b)return;
  var delta={useful:3,deep:2,neutral:0,irrelevant:-3}[action];
  if(b.feedback===action){ // 重复点击 = 撤销
    if(delta!==0)(b.tags||[]).forEach(function(t){state.tagWeights[t]=(state.tagWeights[t]||0)-delta});
    b.feedback=null;
    state.feedbackLog=state.feedbackLog.filter(function(x){return x.briefId!==briefId});
    toast('已撤销反馈');
  }else{
    if(b.feedback){var old={useful:3,deep:2,neutral:0,irrelevant:-3}[b.feedback];if(old!==0)(b.tags||[]).forEach(function(t){state.tagWeights[t]=(state.tagWeights[t]||0)-old})}
    if(delta!==0)(b.tags||[]).forEach(function(t){state.tagWeights[t]=(state.tagWeights[t]||0)+delta});
    b.feedback=action;
    state.feedbackLog.push({id:uid(),date:today(),briefId:briefId,action:action});
    toast('已记录反馈，推荐排序已更新');
  }
  save();refreshAll();
}
function fbCount(a){return state.feedbackLog.filter(function(x){return x.action===a}).length}

      '<div class="detail"><div class="detail-lbl">'+svg('M9 11l3 3L22 4')+'关键发现</div><ul class="findings">'+b.findings.map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></div>'+
      '<div class="detail"><div class="detail-lbl">'+svg('M12 2 2 7l10 5 10-5-10-5Z')+'潜在影响</div><p class="impact-txt">'+esc(b.impact)+'</p></div>'+
      '<div class="detail"><div class="detail-lbl">'+svg('M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4 12 14.01l-3-3')+'可执行建议</div><ol class="findings">'+b.actions.map(function(a){return '<li>'+esc(a)+'</li>'}).join('')+'</ol></div>'+
      '<div class="detail"><div class="detail-lbl">'+svg('M4 4h16v16H4zM8 8h8M8 12h8')+'依据来源</div><div class="evidence">'+esc(b.evidence.src)+' · '+esc(b.evidence.date)+' · '+esc(b.evidence.level)+
        (b.evidence.doi&&b.evidence.doi!=='—'?' · DOI '+esc(b.evidence.doi):'')+
        (b.evidence.url?' · <a href="'+esc(b.evidence.url)+'" target="_blank" rel="noopener">查看原文 ↗</a>':'')+'</div></div>'+
    '</div>'+
    '<div class="brief-ft">'+
      '<button class="'+fbCls('deep')+'" data-fb="'+b.id+'" data-act="deep">'+svg('M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z')+'深读</button>'+
      '<button class="'+fbCls('useful')+'" data-fb="'+b.id+'" data-act="useful">'+svg('M20 6 9 17l-5-5')+'有用</button>'+
      '<button class="'+fbCls('neutral')+'" data-fb="'+b.id+'" data-act="neutral">一般</button>'+
      '<button class="'+fbCls('irrelevant')+'" data-fb="'+b.id+'" data-act="irrelevant">无关</button>'+
      '<div class="ft-right"><button class="'+fbCls('save')+'" data-fb="'+b.id+'" data-act="save" title="收藏">'+svg('M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z')+'</button>'+
      '<span class="note-toggle" data-note="'+b.id+'">笔记'+(b.note?' ✓':'')+'</span></div>'+
    '</div>'+
    '<div class="note-box" id="note-'+b.id+'"><textarea placeholder="记下你的思考、与自身工作的关联、可引用的点…" data-notefield="'+b.id+'">'+esc(b.note)+'</textarea></div>'+
  '</article>';
}

/* ================= 渲染层：知识体系 ================= */
function renderKnowledge(){
  var k=state.ui.kb;
  var tabs=document.querySelectorAll('[data-kb]');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('on',tabs[i].getAttribute('data-kb')===k);
  var box=document.getElementById('kb-panel');
  if(k==='foundation'){
    var cats={};state.concepts.forEach(function(c){(cats[c.category]=cats[c.category]||[]).push(c)});
    box.innerHTML=Object.keys(cats).map(function(cat){
      return '<div style="font-size:12.5px;font-weight:700;color:var(--ink3);margin:14px 0 8px">'+esc(cat)+'</div>'+
        cats[cat].map(function(c){
          return '<div class="concept"><div class="concept-hd">'+
            '<button class="mastery '+(c.mastered?'done':'')+'" data-master="'+c.id+'" title="标记掌握">'+svg('M20 6 9 17l-5-5')+'</button>'+
            '<div style="flex:1"><div class="concept-name" style="'+(c.mastered?'color:var(--ink3)':'')+'">'+esc(c.name)+'</div>'+
            '<div class="concept-def">'+esc(c.def)+'</div>'+
            '<div class="concept-why">为何重要：'+esc(c.why)+'</div>'+
            '<div style="margin-top:8px">'+(c.tags||[]).map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join(' ')+'</div></div></div></div>';
        }).join('');
    }).join('');
  }else{
    var sorted=state.briefs.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
    box.innerHTML='<div style="font-size:12.5px;color:var(--ink2);margin-bottom:16px">按时间追踪的前沿动态，均附来源与可信度。点开简报页可查看完整结论与建议。</div>'+
      sorted.map(function(b){
        return '<div class="timeline-item"><div class="tl-dot"></div><div><div class="tl-date">'+esc(b.date)+' · '+(b.track==='foundation'?'基础':'前沿')+'</div>'+
          '<div class="tl-title">'+esc(b.title)+'</div><div style="font-size:12.5px;color:var(--ink2);margin-top:3px">'+esc(b.oneLiner)+'</div>'+
          '<div style="font-size:11.5px;color:var(--ink3);margin-top:5px">'+esc(b.evidence.src)+(b.evidence.doi&&b.evidence.doi!=='—'?' · '+esc(b.evidence.doi):'')+'</div></div></div>';
      }).join('');
  }
}

/* ================= 渲染层：我的画像 ================= */
function renderProfile(){
  var p=state.profile;
  document.getElementById('pf-industry').value=p.industry||'';
  document.getElementById('pf-role').value=p.role||'';
  document.getElementById('pf-goal').value=p.goal||'';
  document.getElementById('pf-focus').value=(p.focus||[]).join(', ');
  setPref('pref-depth',p.depth);setPref('pref-pace',p.pace);
  var focusTxt=(p.focus||[]).map(function(t){return esc(t)}).join('、')||'未设置';
  document.getElementById('profile-explain').innerHTML='<b>画像如何影响推荐</b>你的关注领域（'+focusTxt+
    '）会为命中的简报加分；每次点"有用 / 深读 / 无关"，系统都会调整对应领域的权重，让后续排序越来越贴合你。你可以在下方看到学到的权重。';
  // 学到的权重
  var w=state.tagWeights||{};var keys=Object.keys(w).filter(function(k){return w[k]!==0}).sort(function(a,b){return Math.abs(w[b])-Math.abs(w[a])});
  var box=document.getElementById('learned-prefs');
  if(!keys.length){box.innerHTML='<div style="font-size:13px;color:var(--ink3)">还没有反馈数据。在简报卡片上点"有用 / 深读 / 无关"，这里会显示系统学到的偏好权重。</div>';return}
  box.innerHTML=keys.map(function(t){
    var v=w[t],pos=v>0;
    return '<div class="bar-row"><span class="lbl">'+esc(t)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+Math.min(100,Math.abs(v)*12)+'%;background:'+(pos?'var(--green)':'var(--rose)')+'"></div></div><span class="v" style="color:'+(pos?'var(--green)':'var(--rose)')+'">'+(pos?'+':'')+v+'</span></div>';
  }).join('')+'<div class="learn-note">绿色 = 你偏好该领域（推荐加权）；红色 = 你表示不感兴趣（推荐降权）。权重实时影响简报排序。</div>';
}
function setPref(id,val){var els=document.querySelectorAll('#'+id+' .pref-opt');for(var i=0;i<els.length;i++)els[i].classList.toggle('on',els[i].getAttribute('data-v')===val)}

/* ================= 渲染层：闭环复盘 ================= */
function renderReview(){
  var b=state.briefs;
  var deep=fbCount('deep'),useful=fbCount('useful'),irr=fbCount('irrelevant'),neu=fbCount('neutral');
  var mastered=state.concepts.filter(function(c){return c.mastered}).length;
  document.getElementById('stat-row').innerHTML=
    stat(state.briefs.length,'简报总数')+stat(deep+useful,'正向反馈')+stat(mastered+'/'+state.concepts.length,'已掌握概念')+stat(state.feedbackLog.length,'互动记录');

  var total=deep+useful+neu+irr;
  var chart=document.getElementById('feedback-chart');
  if(!total){chart.innerHTML='<div style="font-size:13px;color:var(--ink3)">暂无反馈数据。你的每一次"有用 / 深读 / 无感 / 无关"都会记录在这里，并形成推荐闭环。</div>'}
  else{
    var rows=[['深读',deep,'var(--blue)'],['有用',useful,'var(--green)'],['一般',neu,'var(--amber)'],['无关',irr,'var(--rose)']];
    chart.innerHTML=rows.map(function(r){return '<div class="bar-row"><span class="lbl">'+r[0]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(r[1]/total*100)+'%;background:'+r[2]+'"></div></div><span class="v">'+r[1]+'</span></div>'}).join('');
  }

  var supplyDays=Math.max(1,Math.ceil((new Date(today())-new Date(state.meta.createdAt))/86400000));
  document.getElementById('loop-status').innerHTML=
    '<div style="font-size:13.2px;line-height:1.9">'+
    '<div>① <b>跟进</b>：简报按日/周更新，'+state.briefs.length+' 条供稿附来源与可信度</div>'+
    '<div>② <b>总结</b>：每条含一句话结论 + 关键发现 + 潜在影响 + 可执行建议</div>'+
    '<div>③ <b>反馈</b>：'+(total?'已记录 '+total+' 次互动':'尚未记录反馈')+'，系统据此调整 '+Object.keys(state.tagWeights).filter(function(k){return state.tagWeights[k]}).length+' 个领域权重</div>'+
    '<div>④ <b>推荐</b>：相关度分数实时重算，排序随你的偏好变化</div>'+
    '</div><div class="learn-note">当前画像：'+(state.profile.industry||'未设置')+' · '+(state.profile.role||'未设置')+'。闭环已运行 '+supplyDays+' 天。</div>';
}
function stat(n,l){return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'}

function refreshAll(){renderHeader();renderBriefs();renderKnowledge();renderProfile();renderReview()}

/* ================= 事件实现 ================= */
var pendingCF=null;
function askCF(title,msg,fn){document.getElementById('cf-title').textContent=title;document.getElementById('cf-msg').textContent=msg;pendingCF=fn;document.getElementById('confirm-overlay').classList.add('show')}
function closeCF(){pendingCF=null;document.getElementById('confirm-overlay').classList.remove('show')}

function onAction(a,el,ds){
  if(a==='pref'){
    var g=ds.group,v=ds.val;
    if(g==='pref-depth')state.profile.depth=v;else if(g==='pref-pace')state.profile.pace=v;
    save();renderProfile();toast('偏好已更新');
  }
  else if(a==='master'){
    var id=ds.id;state.concepts.forEach(function(c){if(c.id===id)c.mastered=!c.mastered});
    save();renderKnowledge();renderReview();
  }
  else if(a==='note'){
    var box=document.getElementById('note-'+ds.id);if(box)box.classList.toggle('show');
  }
  else if(a==='save-profile'){
    var f=el;
    state.profile={
      industry:f.elements.industry.value.trim(),role:f.elements.role.value.trim(),
      goal:f.elements.goal.value.trim(),focus:parseTags(f.elements.focus.value),
      depth:state.profile.depth,pace:state.profile.pace
    };
    save();refreshAll();toast('画像已保存，推荐已重算');
  }
  else if(a==='export'){
    var payload={_app:'行业认知简报系统',_version:2,_exportAt:new Date().toISOString(),data:state};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    var url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download='行业认知简报备份_'+today()+'.json';document.body.appendChild(link);link.click();document.body.removeChild(link);
    setTimeout(function(){URL.revokeObjectURL(url)},1200);toast('备份已导出');
  }
  else if(a==='import'){document.getElementById('import-file').click()}
  else if(a==='import-file'){
    var file=el.files&&el.files[0];if(!file)return;var r=new FileReader();
    r.onload=function(){var p;try{p=JSON.parse(r.result)}catch(e){toast('不是有效 JSON');return}
      var d=p&&p.data?p.data:p;if(!d||!Array.isArray(d.briefs)){toast('备份格式不匹配');return}
      askCF('导入备份','将用备份覆盖当前全部数据，确定继续吗？',function(){state=d;shape();save();refreshAll();toast('导入成功')});
      el.value='';
    };r.readAsText(file,'utf-8');
  }
  else if(a==='cf-cancel'){closeCF()}
  else if(a==='cf-ok'){var fn=pendingCF;closeCF();if(fn)fn()}
}

/* 笔记自动保存（失焦） */
document.addEventListener('focusout',function(e){
  if(e.target&&e.target.getAttribute&&e.target.getAttribute('data-notefield')){
    var id=e.target.getAttribute('data-notefield');
    state.briefs.forEach(function(b){if(b.id===id)b.note=e.target.value});
    save();
  }
});

/* 事件委托 */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab]');if(t){switchTab(t.getAttribute('data-tab'));return}
  var h=e.target.closest('[data-horizon]');if(h){state.ui.horizon=h.getAttribute('data-horizon');save();renderBriefs();return}
  var k=e.target.closest('[data-kb]');if(k){state.ui.kb=k.getAttribute('data-kb');save();renderKnowledge();return}
  var po=e.target.closest('.pref-opt');if(po){onAction('pref',po,{group:po.parentNode.id,val:po.getAttribute('data-v')});return}
  var a=e.target.closest('[data-action]');if(a){onAction(a.getAttribute('data-action'),a,a.dataset);return}
  var fb=e.target.closest('[data-fb]');if(fb){applyFeedback(fb.getAttribute('data-fb'),fb.getAttribute('data-act'));return}
  var m=e.target.closest('[data-master]');if(m){onAction('master',m,{id:m.getAttribute('data-master')});return}
  var nt=e.target.closest('[data-note]');if(nt){onAction('note',nt,{id:nt.getAttribute('data-note')});return}
});
document.addEventListener('submit',function(e){if(e.target.id==='profile-form'){e.preventDefault();onAction('save-profile',e.target,{})}});
document.addEventListener('input',function(e){if(e.target.id==='pf-goal'||e.target.id==='pf-focus')return});
document.getElementById('confirm-overlay').addEventListener('click',function(e){if(e.target===this)onAction('cf-cancel')});
document.getElementById('import-file').addEventListener('change',function(){onAction('import-file',this,{})});

function switchTab(key){
  state.ui.tab=key;save();
  var tabs=document.querySelectorAll('[data-tab]');for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('active',tabs[i].getAttribute('data-tab')===key);
  var views=document.querySelectorAll('.view');for(var j=0;j<views.length;j++)views[j].classList.toggle('active',views[j].id==='view-'+key);
  window.scrollTo({top:0,behavior:'smooth'});
}
function init(){
  load();
  var d=new Date(),wd=['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('pill-date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+wd;
  document.getElementById('footnote').textContent='简报内容供稿：'+state.meta.lastSupply+' · 数据仅存本地浏览器 · 建议定期导出备份';
  refreshAll();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
