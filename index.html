<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>行业认知提升工作台</title>
<!-- 本地单文件工作台：全内联零外链，数据存储于浏览器 localStorage -->
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --line:#e6eaf2; --line-2:#eef1f7;
  --ink:#1e293b; --ink-2:#5b667a; --ink-3:#93a0b5;
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eef4ff;
  --red:#dc2626; --red-l:#fef2f2; --green:#16a34a; --green-l:#f0fdf4;
  --amber:#d97706; --amber-l:#fffbeb; --violet:#7c3aed; --violet-l:#f5f3ff;
  --teal:#0d9488; --teal-l:#f0fdfa;
  --r:14px; --r-s:10px; --sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 120px}

/* ---------- Header ---------- */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;flex:none}
.brand-logo svg{width:22px;height:22px}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.brand p{font-size:12px;margin:0;color:var(--ink-3)}
.hdr-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--r-s);font-size:14px;font-weight:600;transition:.16s;border:1px solid transparent;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:#cbd5e1;color:var(--ink)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-danger{background:var(--red-l);color:var(--red)}
.btn-sm{min-height:36px;padding:0 11px;font-size:13px;border-radius:8px}
.btn-block{width:100%}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);padding:6px 10px;border-radius:99px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}

/* ---------- Backup hint ---------- */
.backup-hint{display:none;margin:14px 0 0;background:var(--amber-l);border:1px solid #fde68a;color:#92400e;border-radius:var(--r-s);padding:10px 14px;font-size:13px;align-items:center;gap:10px}
.backup-hint.show{display:flex}
.backup-hint button{margin-left:auto;color:#92400e;font-weight:700;text-decoration:underline;font-size:13px}

/* ---------- Nav tabs ---------- */
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:5px;margin:18px 0;box-shadow:var(--sh)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2);transition:.16s}
.tab svg{width:18px;height:18px}
.tab:hover{background:var(--bg)}
.tab.active{background:var(--blue);color:#fff}
.tab.active svg{stroke:#fff}

/* ---------- Cards / sections ---------- */
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-head h2 svg{width:19px;height:19px;color:var(--blue)}
.sec-head .sub{font-size:12px;color:var(--ink-3);font-weight:400}
.sec-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.muted{color:var(--ink-3)}
.empty{text-align:center;padding:30px 12px;color:var(--ink-3);font-size:14px}
.empty svg{width:38px;height:38px;opacity:.5;margin-bottom:8px}

/* ---------- Today ---------- */
.today-card{border-left:4px solid var(--blue)}
.today-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.today-item:last-child{border-bottom:none}
.today-check{width:26px;height:26px;border-radius:8px;border:2px solid #cbd5e1;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.16s}
.today-check:hover{border-color:var(--blue);background:var(--blue-l)}
.today-check svg{width:15px;height:15px;color:#fff;opacity:0}
.today-check.done{background:var(--green);border-color:var(--green)}
.today-check.done svg{opacity:1}
.today-main{flex:1;min-width:0}
.today-title{font-weight:600;font-size:14px;word-break:break-word}
.today-title.done{text-decoration:line-through;color:var(--ink-3)}
.today-meta{font-size:12px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;align-items:center}
.overdue{color:var(--red)!important;font-weight:700}
.today-act{display:flex;gap:6px;flex:none}
.icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);transition:.16s}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.del:hover{background:var(--red-l);color:var(--red)}

/* ---------- Chips / tags ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--ink-2);border:1px solid var(--line)}
.chip.blue{background:var(--blue-l);color:var(--blue);border-color:#dbeafe}
.chip.red{background:var(--red-l);color:var(--red);border-color:#fee2e2}
.chip.green{background:var(--green-l);color:var(--green);border-color:#dcfce7}
.chip.amber{background:var(--amber-l);color:var(--amber);border-color:#fef3c7}
.chip.violet{background:var(--violet-l);color:var(--violet);border-color:#ede9fe}
.chip.teal{background:var(--teal-l);color:var(--teal);border-color:#ccfbf1}
.chip.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.tagbtn{cursor:pointer;user-select:none}
.tagbtn:hover{border-color:var(--blue);color:var(--blue)}

/* ---------- Feed ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r-s);padding:0 14px 0 38px;background:var(--card);outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3)}
.fsel{min-height:44px;border:1px solid var(--line);border-radius:var(--r-s);padding:0 10px;background:var(--card);outline:none;max-width:150px}
.fsel:focus{border-color:var(--blue)}
.item{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:10px;transition:.16s;background:var(--card)}
.item:hover{border-color:#cbd5e1;box-shadow:var(--sh)}
.item.is-read{opacity:.62}
.item-ic{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.item-ic svg{width:19px;height:19px}
.item-body{flex:1;min-width:0}
.item-title{font-weight:650;font-size:14.5px;word-break:break-word}
.item-title a{color:var(--ink)}
.item-title a:hover{color:var(--blue)}
.item-sum{font-size:13px;color:var(--ink-2);margin-top:3px;word-break:break-word}
.item-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:8px}
.item-acts{display:flex;flex-direction:column;gap:4px;flex:none}

/* ---------- Knowledge ---------- */
.kb-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap}
.kb-tab{padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.kb-tab.active{background:var(--violet-l);color:var(--violet)}
.card-note{background:linear-gradient(180deg,#fff,#fbfcff);border:1px solid var(--line);border-radius:var(--r-s);padding:14px;margin-bottom:10px}
.note-title{font-weight:700;font-size:14.5px;display:flex;align-items:flex-start;gap:8px}
.note-title svg{width:17px;height:17px;color:var(--violet);flex:none;margin-top:2px}
.note-body{font-size:13.5px;color:var(--ink-2);margin-top:6px;white-space:pre-wrap;word-break:break-word}
.flashcard{background:linear-gradient(135deg,#f5f3ff,#eef4ff);border:1px solid #ddd6fe;border-radius:var(--r);padding:18px;margin-bottom:12px;position:relative;min-height:120px}
.fc-q{font-weight:700;font-size:15px;color:var(--violet)}
.fc-a{font-size:13.5px;color:var(--ink-2);margin-top:10px;display:none;white-space:pre-wrap}
.flashcard.open .fc-a{display:block}
.fc-actions{display:flex;gap:8px;margin-top:12px}
.tag-cloud{display:flex;gap:8px;flex-wrap:wrap}
.tag-cloud .chip{font-size:13px;padding:6px 13px;cursor:pointer}
.tag-cloud .chip b{font-weight:700;margin-left:3px}

/* ---------- Review / stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:14px;box-shadow:var(--sh)}
.stat .n{font-size:26px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink-3);margin-top:4px}
.stat .d{font-size:11px;margin-top:4px}
.stat.blue .n{color:var(--blue)} .stat.green .n{color:var(--green)} .stat.violet .n{color:var(--violet)} .stat.amber .n{color:var(--amber)}
.chart-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:16px}
.chart-box h3{font-size:14px;margin:0 0 12px;font-weight:700}
.chart-box svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.review-item{border-left:3px solid var(--violet);padding:10px 14px;background:var(--violet-l);border-radius:0 var(--r-s) var(--r-s) 0;margin-bottom:10px}
.review-item .rd{font-size:12px;color:var(--violet);font-weight:700;margin-bottom:4px}
.review-item p{margin:3px 0;font-size:13.5px;color:var(--ink-2)}
.reminder{background:var(--amber-l);border:1px solid #fde68a;border-radius:var(--r-s);padding:12px 14px;font-size:13px;color:#92400e;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.reminder svg{width:18px;height:18px;flex:none}

/* ---------- Progress ring ---------- */
.ring-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:120px;height:120px;flex:none}
.ring-info{flex:1;min-width:160px}
.ring-info .big{font-size:22px;font-weight:800}
.ring-info .sm{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.hbar{height:9px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:6px}
.hbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .5s}
.prog-line{margin-top:12px}
.prog-line .pl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}

/* ---------- Drawer / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:90;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
@media(min-width:769px){.overlay.show{align-items:center}}
.drawer{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + var(--safe));max-height:90vh;overflow-y:auto;animation:up .25s ease}
@media(min-width:769px){.drawer{border-radius:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.drawer h2{margin:0 0 16px;font-size:18px;display:flex;align-items:center;gap:8px}
.drawer h2 svg{width:20px;height:20px;color:var(--blue)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;background:var(--card);outline:none}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.drawer-acts{display:flex;gap:10px;margin-top:18px}
.drawer-acts .btn{flex:1}

/* ---------- Modal ---------- */
.modal{background:var(--card);width:calc(100% - 32px);max-width:440px;border-radius:18px;padding:24px 20px;animation:up .2s ease}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{color:var(--ink-2);font-size:14px;margin:0 0 18px}
.modal-acts{display:flex;gap:10px}
.modal-acts .btn{flex:1}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(30px + var(--safe));transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:120;opacity:0;pointer-events:none;transition:.28s;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Floating add ---------- */
.fab{position:fixed;right:18px;bottom:calc(24px + var(--safe));width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 8px 22px rgba(37,99,235,.42);display:flex;align-items:center;justify-content:center;z-index:50}
.fab svg{width:26px;height:26px}
.fab:hover{background:var(--blue-d)}

/* ---------- Footer note ---------- */
.footnote{text-align:center;font-size:11.5px;color:var(--ink-3);padding:10px 0 20px}

/* ---------- Responsive ---------- */
@media(max-width:860px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
  .wrap{padding:0 12px 130px}
  .topbar-in{padding:10px 12px}
  .brand h1{font-size:15px}
  .brand p{display:none}
  .hdr-tools .btn span{display:none}
  .hdr-tools .btn{width:44px;padding:0}
  .sync-pill{font-size:11px;padding:5px 8px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .tabs{position:fixed;left:0;right:0;bottom:0;border-radius:0;margin:0;border:none;border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe));z-index:45;box-shadow:0 -2px 14px rgba(16,24,40,.06)}
  .tab{flex-direction:column;gap:2px;min-height:52px;font-size:11px;border-radius:9px}
  .tab svg{width:20px;height:20px}
  .sec-head .right{width:100%;margin-left:0}
  .sec-head .right .btn{flex:1}
  .item-acts{flex-direction:row}
  .ring{width:100px;height:100px}
  .fsel{max-width:none;flex:1}
  /* 悬浮按钮抬高，避免遮挡底部 Tab 栏 */
  .fab{bottom:calc(84px + var(--safe));right:16px;width:52px;height:52px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      </div>
      <div>
        <h1>行业认知提升工作台</h1>
        <p id="brand-sub">你的行业 · 你的岗位 · 持续进化</p>
      </div>
    </div>
    <div class="hdr-tools">
      <span class="sync-pill"><span class="sync-dot"></span><span id="sync-text">本地已保存</span></span>
      <button class="btn btn-ghost btn-sm" data-action="export-json" title="导出 JSON 备份"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg><span>导出</span></button>
      <button class="btn btn-ghost btn-sm" data-action="import-json" title="导入恢复"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg><span>导入</span></button>
      <button class="btn btn-ghost btn-sm" data-action="open-settings" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg><span>设置</span></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="backup-hint" id="backup-hint">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
    <span id="backup-hint-text">数据已积累一定量，建议导出一份备份</span>
    <button data-action="export-json">立即备份</button>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="dashboard" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      总览
    </button>
    <button class="tab" data-tab="feed" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/><circle cx="19" cy="18" r="2"/></svg>
      信息流
    </button>

<script>
/* ============================================================
   行业认知提升工作台 — 单文件 / 零外链 / localStorage
   架构：数据层 -> 计算层 -> 渲染层（单向）
   所有渲染由 refreshAll() 统一调度，渲染函数之间互不调用
   ============================================================ */
(function(){
'use strict';

/* ---------- 常量 ---------- */
var NS='wb_industry_cognition_';
var KEY=NS+'state_v1';
var TYPES={
  news:{label:'行业动态',color:'blue',icon:'M4 5h16M4 10h16M4 15h10M4 20h7'},
  trend:{label:'趋势关键词',color:'amber',icon:'m12 3 2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4L12 3Z'},
  case:{label:'公司/案例',color:'teal',icon:'M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6'},
  article:{label:'深度文章',color:'violet',icon:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z'},
  note:{label:'观点笔记',color:'green',icon:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z'}
};
var STATUS={unread:'待读',reading:'在读',read:'已读'};

/* ---------- 工具函数 ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function pad(n){return n<10?'0'+n:''+n}
function dateStr(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dateStr(d)}
function today(){return dateStr(new Date())}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function parseTags(s){if(Array.isArray(s))return s.filter(Boolean);return String(s||'').split(/[,，、\s]+/).map(function(t){return t.trim()}).filter(Boolean)}
function svg(path,extra){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+(extra||'')+'><path d="'+path+'"/></svg>'}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show')},2200)}

/* ---------- 数据层 ---------- */
var state=null;
function seed(){
  var t=today();
  return {
    profile:{industry:'医疗健康 / 康复医学',role:'医生 / 大学教授',focus:['脑机接口','卒中康复','认知障碍','闭环康复'],goal:'每天沉淀 1 条行业认知，每周完成 1 次复盘',dailyCount:3,reviewCycle:'daily'},
    items:[
      {id:uid(),type:'article',title:'自适应闭环脑机接口在卒中认知康复中的研究进展',summary:'梳理状态监测驱动的闭环康复范式，关注 EEG 特征解码与实时反馈策略。',url:'',tags:['脑机接口','卒中康复'],source:'深度文章',status:'unread',starred:true,dueDate:addDays(t,-1),createdAt:addDays(t,-3),readAt:''},
      {id:uid(),type:'trend',title:'趋势关键词：状态监测 / 闭环刺激 / 个体化阈值',summary:'近期高频出现的三个概念，值得建立认知卡片持续追踪。',url:'',tags:['闭环康复','脑机接口'],source:'趋势雷达',status:'unread',starred:false,dueDate:t,createdAt:addDays(t,-1),readAt:''},
      {id:uid(),type:'case',title:'某厂商 EEG 闭环康复系统产品拆解',summary:'采集—解码—反馈链路完整，但个体化阈值自适应能力仍有空白。',url:'',tags:['脑机接口','竞品'],source:'公司案例',status:'reading',starred:false,dueDate:t,createdAt:t,readAt:''},
      {id:uid(),type:'news',title:'行业动态：康复医学中心建设指南更新',summary:'关注认知康复评估相关章节的更新要点。',url:'',tags:['卒中康复','政策'],source:'行业动态',status:'unread',starred:false,dueDate:addDays(t,1),createdAt:t,readAt:''},
      {id:uid(),type:'note',title:'观点笔记：状态监测是闭环康复的前提',summary:'没有可靠的脑状态解码，所谓"自适应"只是开环的进阶版。',url:'',tags:['闭环康复'],source:'个人观点',status:'read',starred:true,dueDate:'',createdAt:addDays(t,-2),readAt:addDays(t,-2)}
    ],
    cards:[
      {id:uid(),q:'闭环康复与开环康复的本质区别是什么？',a:'闭环依赖对脑状态的实时解码，根据当前状态动态调整刺激/反馈参数；开环按固定方案执行，不感知状态变化。',tags:['闭环康复'],source:'自适应闭环认知康复',reviews:0,lastReview:'',createdAt:addDays(t,-2)},
      {id:uid(),q:'tDCS 治疗 PSCI 的关键效应方向如何判定？',a:'需结合 Direction_factor 与电极靶点，避免方向符号错误；靶点分类优先使用 Electrode_pair。',tags:['卒中康复','认知障碍'],source:'个人研究',reviews:1,lastReview:addDays(t,-1),createdAt:addDays(t,-4)}
    ],
    reviews:[
      {id:uid(),date:addDays(t,-2),good:'完成闭环 BCI 综述精读，建立第一张认知卡片。',bad:'信息流收录零散，标签体系未统一。',next:'统一标签命名，固定每天 15:00 处理待读。',createdAt:addDays(t,-2)}
    ],
    ui:{kbTab:'cards',recSeed:0,seeded:true},
    meta:{lastOpen:t,createdAt:t}
  };
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){state=JSON.parse(raw);ensureShape();return}
  }catch(e){}
  state=seed();save();
}
function ensureShape(){
  var d=seed();
  ['profile','items','cards','reviews','ui','meta'].forEach(function(k){if(!state[k])state[k]=d[k]});
  ['industry','role','focus','goal','dailyCount','reviewCycle'].forEach(function(k){if(state.profile[k]===undefined)state.profile[k]=d.profile[k]});
  if(!Array.isArray(state.items))state.items=[];
  if(!Array.isArray(state.cards))state.cards=[];
  if(!Array.isArray(state.reviews))state.reviews=[];
  if(!state.ui)state.ui=d.ui;
  if(state.ui.kbTab===undefined)state.ui.kbTab='cards';
  if(state.ui.recSeed===undefined)state.ui.recSeed=0;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));setSync('本地已保存')}
  catch(e){setSync('保存失败')}
}
function setSync(t){var el=document.getElementById('sync-text');if(el)el.textContent=t}

/* ---------- 计算层：推荐 / 统计 ---------- */
/* 扩展点：个性化推荐规则注册。规则签名 function(item,profile,ctx)->number (权重) */
var RECOMMEND_RULES=[];
function registerRecommendRule(fn){if(typeof fn==='function')RECOMMEND_RULES.push(fn)}
/* 扩展点：外部数据源适配器注册。适配器签名 {name, fetch:function()->Promise<Item[]>} */
var DATA_SOURCES=[];
function registerDataSource(src){if(src&&typeof src.fetch==='function')DATA_SOURCES.push(src)}
window.WB_Insight={registerRecommendRule:registerRecommendRule,registerDataSource:registerDataSource,getState:function(){return state},save:save};

function focusScore(item){
  var focus=parseTags(state.profile.focus),tags=(item.tags||[]).map(function(x){return String(x).toLowerCase()});
  var s=0;focus.forEach(function(f){f=String(f).toLowerCase();if(!f)return;if(tags.indexOf(f)>=0)s+=3;else if(String(item.title+' '+item.summary).toLowerCase().indexOf(f)>=0)s+=1});
  return s;
}
function recommend(n){
  var pool=state.items.filter(function(i){return i.status!=='read'});
  var scored=pool.map(function(it){
    var s=focusScore(it)+(it.starred?2:0)+(it.status==='reading'?1:0);
    RECOMMEND_RULES.forEach(function(fn){try{s+=Number(fn(it,state.profile,{}))||0}catch(e){}});
    return {it:it,s:s};
  });
  scored.sort(function(a,b){return b.s-a.s||String(b.it.createdAt).localeCompare(String(a.it.createdAt))});
  var offset=(state.ui.recSeed||0)%Math.max(1,scored.length);
  var rotated=scored.slice(offset).concat(scored.slice(0,offset));
  return rotated.slice(0,n||3).map(function(x){return x.it});
}
function stats(){
  var items=state.items,cards=state.cards;
  var done=items.filter(function(i){return i.status==='read'}).length;
  var todayDone=items.filter(function(i){return i.readAt&&i.readAt.slice(0,10)===today()}).length;
  var overdue=items.filter(function(i){return i.status!=='read'&&i.dueDate&&i.dueDate<today()}).length;
  var due=items.filter(function(i){return i.status!=='read'&&i.dueDate&&i.dueDate<=today()}).length;
  var week=[];var t=today();
  for(var i=6;i>=0;i--){var d=addDays(t,-i);week.push({d:d,n:items.filter(function(x){return x.createdAt&&x.createdAt.slice(0,10)===d}).length+cards.filter(function(x){return x.createdAt&&x.createdAt.slice(0,10)===d}).length})}
  return {total:items.length,done:done,doneRate:items.length?Math.round(done/items.length*100):0,todayDone:todayDone,overdue:overdue,due:due,cards:cards.length,reviews:state.reviews.length,week:week};
}
function todayList(){
  var t=today();
  return state.items.filter(function(i){return i.status!=='read'&&i.dueDate&&i.dueDate<=t})
    .sort(function(a,b){return a.dueDate.localeCompare(b.dueDate)});
}

/* ================= 渲染层：总览 ================= */
function renderBrand(){
  var p=state.profile;
  var sub=document.getElementById('brand-sub');
  if(sub)sub.textContent=[p.industry,p.role].filter(Boolean).join(' · ')||'你的行业 · 你的岗位 · 持续进化';
}
function renderBackupHint(){
  var n=state.items.length+state.cards.length+state.reviews.length;
  var box=document.getElementById('backup-hint');
  if(n>=30){box.classList.add('show');document.getElementById('backup-hint-text').textContent='数据已积累 '+n+' 条，建议导出一份 JSON 备份'}
  else box.classList.remove('show');
}
function renderToday(){

function dayDiff(a,b){
  var d1=new Date(a+'T00:00:00'),d2=new Date(b+'T00:00:00');

}

      '<text x="60" y="57" text-anchor="middle" font-size="24" font-weight="800" fill="#1e293b">'+s.doneRate+'%</text>'+

      '<div class="prog-line"><div class="pl"><span>待办（含逾期 '+s.overdue+'）</span><b>'+s.due+' 条</b></div><div class="hbar"><i style="width:'+Math.min(100,s.due*15)+'%;background:var(--amber)"></i></div></div>'+

function renderFeed(){
  var list=state.items.slice();
  var kw=(document.getElementById('feed-search').value||'').trim().toLowerCase();
  var type=document.getElementById('feed-type').value;
  var status=document.getElementById('feed-status').value;
  var selTag=window._feedSelTag||'';

  // 填充类型下拉（只做一次）
  var sel=document.getElementById('feed-type');
  if(sel.options.length<=1){Object.keys(TYPES).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=TYPES[k].label;sel.appendChild(o)})}

  // 标签栏（按钮形式，点击筛选）
  var tagCount={};list.forEach(function(it){(it.tags||[]).forEach(function(tg){tagCount[tg]=(tagCount[tg]||0)+1})});
  var tags=Object.keys(tagCount).sort(function(a,b){return tagCount[b]-tagCount[a]});
  document.getElementById('feed-tagbar').innerHTML='<span class="muted" style="font-size:12px">标签：</span>'+
    '<span class="chip tagbtn '+(selTag?'':'sel')+'" data-tag="">全部</span>'+
    tags.map(function(tg){return '<span class="chip tagbtn '+(selTag===tg?'sel':'')+'" data-tag="'+esc(tg)+'">'+esc(tg)+'<b>'+tagCount[tg]+'</b></span>'}).join('');

  if(kw)list=list.filter(function(it){return String(it.title+' '+it.summary+' '+(it.tags||[]).join(' ')).toLowerCase().indexOf(kw)>=0});
  if(type)list=list.filter(function(it){return it.type===type});
  if(status)list=list.filter(function(it){return it.status===status});
  if(selTag)list=list.filter(function(it){return (it.tags||[]).indexOf(selTag)>=0});
  list.sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt))});

  document.getElementById('feed-count').textContent='共 '+state.items.length+' 条 · 当前 '+list.length+' 条';
  var box=document.getElementById('feed-list');
  if(!list.length){box.innerHTML='<div class="empty">'+svg('M4 5h16M4 10h16M4 15h10M4 20h7')+'<div>没有符合条件的内容</div></div>';return}
  box.innerHTML=list.map(function(it){
    var ty=TYPES[it.type]||TYPES.note;
    var over=it.status!=='read'&&it.dueDate&&it.dueDate<today();
    var stCls=it.status==='read'?'green':(it.status==='reading'?'amber':'blue');
    var title=it.url?'<a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>':esc(it.title);
    var acts='<button class="icon-btn" data-action="edit-item" data-id="'+it.id+'" title="编辑">'+svg('M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z')+'</button>';
    if(it.status!=='read')acts+='<button class="icon-btn" data-action="item-done" data-id="'+it.id+'" title="标记已读">'+svg('M20 6 9 17l-5-5')+'</button>';
    return '<div class="item '+(it.status==='read'?'is-read':'')+'">'+
      '<div class="item-ic" style="background:var(--'+ty.color+'-l);color:var(--'+ty.color+')">'+svg(ty.icon)+'</div>'+
      '<div class="item-body"><div class="item-title">'+title+'</div>'+
      (it.summary?'<div class="item-sum">'+esc(it.summary)+'</div>':'')+
      '<div class="item-meta"><span class="chip '+ty.color+'">'+ty.label+'</span><span class="chip '+stCls+'">'+STATUS[it.status]+'</span>'+
      (it.starred?'<span class="chip amber">★ 重点</span>':'')+
      (over?'<span class="overdue" style="font-size:11px">逾期</span>':'')+
      (it.dueDate?'<span class="muted" style="font-size:11px">'+esc(it.dueDate)+'</span>':'')+
      (it.tags||[]).map(function(tg){return '<span class="chip">'+esc(tg)+'</span>'}).join('')+'</div></div>'+
      '<div class="item-acts">'+acts+'</div></div>';

function viewTags(){
  var map={};
  state.items.forEach(function(it){(it.tags||[]).forEach(function(tg){(map[tg]=map[tg]||[]).push(it.title)})});
  state.cards.forEach(function(c){(c.tags||[]).forEach(function(tg){(map[tg]=map[tg]||[]).push(c.q)})});
  var keys=Object.keys(map).sort(function(a,b){return map[b].length-map[a].length});
  if(!keys.length)return '<div class="empty"><div>还没有标签</div></div>';
  return '<div class="muted" style="font-size:12.5px;margin-bottom:10px">点击标签查看归入该标签的全部内容</div>'+
    '<div class="tag-cloud">'+keys.map(function(k){return '<span class="chip tagbtn" data-tag="'+esc(k)+'">'+esc(k)+'<b>'+map[k].length+'</b></span>'}).join('')+'</div>'+
    '<div style="margin-top:16px">'+keys.map(function(k){return '<details style="border-bottom:1px solid var(--line-2);padding:8px 0"><summary style="cursor:pointer;font-weight:600;font-size:13.5px">'+esc(k)+' · '+map[k].length+' 条</summary><ul style="font-size:13px;color:var(--ink-2);margin:8px 0 4px 18px;padding:0">'+map[k].map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></details>'}).join('')+'</div>';
}

  }).join('');

function statCard(color,n,label,d){

}

    {k:'type',l:'类型',t:'select',opts:Object.keys(TYPES).map(function(k){return [k,TYPES[k].label]})},
    {k:'title',l:'标题',t:'text',req:true,ph:'这条信息的标题'},
    {k:'summary',l:'摘要 / 内容',t:'textarea',ph:'核心观点、关键信息…'},
    {k:'url',l:'原文链接',t:'text',ph:'https://…'},
    {k:'tags',l:'标签（逗号分隔）',t:'text',ph:'脑机接口, 卒中康复'},
    {k:'source',l:'来源',t:'text',ph:'期刊 / 公众号 / 会议'},
    {k:'status',l:'阅读状态',t:'select',opts:[['unread','待读'],['reading','在读'],['read','已读']]},
    {k:'dueDate',l:'计划处理日期',t:'date'},
    {k:'starred',l:'标为重点',t:'check'}
  ]},
  card:{title:'认知卡片',fields:[
    {k:'q',l:'问题 / 概念',t:'textarea',req:true,ph:'用一个问题或概念命名这张卡片'},
    {k:'a',l:'答案 / 我的理解',t:'textarea',ph:'用自己的话写下答案，印象更深'},
    {k:'tags',l:'标签（逗号分隔）',t:'text'},
    {k:'source',l:'来源',t:'text'}
  ]},
  review:{title:'复盘记录',fields:[
    {k:'date',l:'日期',t:'date',req:true},
    {k:'good',l:'今天的收获',t:'textarea'},
    {k:'bad',l:'不足 / 卡点',t:'textarea'},
    {k:'next',l:'下一步行动',t:'textarea'}
  ]}
};
var editorMeta={kind:'',id:''};
function openEditor(kind,id){
  var schema=SCHEMAS[kind];if(!schema)return;
  editorMeta={kind:kind,id:id||''};
  var val=null;
  if(id){
    var arr=kind==='item'?state.items:(kind==='card'?state.cards:state.reviews);
    for(var i=0;i<arr.length;i++)if(arr[i].id===id){val=arr[i];break}
  }
  var d=val||defaultFor(kind);
  document.getElementById('editor-title').textContent=(id?'编辑':'新建')+schema.title;
  document.getElementById('editor-fields').innerHTML=schema.fields.map(function(f){
    var v=d[f.k]!==undefined?d[f.k]:'';
    var label='<label>'+esc(f.l)+(f.req?' *':'')+'</label>';
    if(f.t==='textarea')return '<div class="field">'+label+'<textarea name="'+f.k+'" '+(f.ph?'placeholder="'+esc(f.ph)+'"':'')+'>'+esc(v)+'</textarea></div>';
    if(f.t==='select')return '<div class="field">'+label+'<select name="'+f.k+'">'+f.opts.map(function(o){return '<option value="'+o[0]+'" '+(String(v)===o[0]?'selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select></div>';
    if(f.t==='check')return '<div class="field"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="'+f.k+'" '+(v?'checked':'')+' style="width:20px;min-height:20px"> '+esc(f.l)+'</label></div>';
    var ft=f.t==='date'?'date':'text';
    return '<div class="field">'+label+'<input type="'+ft+'" name="'+f.k+'" value="'+esc(v)+'" '+(f.ph?'placeholder="'+esc(f.ph)+'"':'')+'></div>';
  }).join('');
  document.getElementById('editor-delete').style.display=id?'block':'none';
  document.getElementById('editor-overlay').classList.add('show');
}
function defaultFor(kind){
  if(kind==='item')return {type:'article',title:'',summary:'',url:'',tags:[],source:'',status:'unread',dueDate:today(),starred:false};
  if(kind==='card')return {q:'',a:'',tags:[],source:''};
  return {date:today(),good:'',bad:'',next:''};
}
function closeEditor(){document.getElementById('editor-overlay').classList.remove('show')}
function saveEditor(form){
  var kind=editorMeta.kind,schema=SCHEMAS[kind],obj={};
  schema.fields.forEach(function(f){
    var el=form.elements[f.k];if(!el)return;
    if(f.t==='check')obj[f.k]=el.checked;
    else if(f.k==='tags')obj[f.k]=parseTags(el.value);
    else obj[f.k]=el.value.trim();
  });
  var req=schema.fields.filter(function(f){return f.req});
  for(var i=0;i<req.length;i++){if(!obj[req[i].k]){toast('请填写：'+req[i].l);return}}
  var arr=kind==='item'?state.items:(kind==='card'?state.cards:state.reviews);
  if(editorMeta.id){
    for(var j=0;j<arr.length;j++)if(arr[j].id===editorMeta.id){
      var old=arr[j];
      for(var k in obj)old[k]=obj[k];
      if(kind==='item'&&old.status==='read'&&!old.readAt)old.readAt=today();
      break;
    }
  }else{
    obj.id=uid();obj.createdAt=today();
    if(kind==='card'){obj.reviews=0;obj.lastReview=''}
    arr.unshift(obj);
  }
  save();closeEditor();refreshAll();toast('已保存');
}
function deleteEditor(){
  var id=editorMeta.id,kind=editorMeta.kind;if(!id)return;
  askConfirm('删除确认','确定删除这条内容吗？此操作不可撤销。',function(){
    if(kind==='item')state.items=state.items.filter(function(x){return x.id!==id});
    else if(kind==='card')state.cards=state.cards.filter(function(x){return x.id!==id});
    else state.reviews=state.reviews.filter(function(x){return x.id!==id});
    save();closeEditor();refreshAll();toast('已删除');
  });
}

/* ================= 交互层：导入导出 ================= */
function exportJSON(){
  var payload={_app:'行业认知提升工作台',_version:1,_exportAt:new Date().toISOString(),data:state};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='行业认知工作台备份_'+today()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1500);
  toast('备份已导出');
}
function handleImportFile(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    var parsed;
    try{parsed=JSON.parse(reader.result)}catch(e){toast('文件不是有效的 JSON');input.value='';return}
    var data=parsed&&parsed.data?parsed.data:parsed;
    if(!data||!Array.isArray(data.items)||!Array.isArray(data.cards)){toast('备份格式不匹配');input.value='';return}
    askConfirm('导入恢复','将用备份覆盖当前全部数据（'+data.items.length+' 条信息 / '+data.cards.length+' 张卡片），确定继续吗？',function(){
      state=data;ensureShape();save();refreshAll();toast('导入成功');
    });
    input.value='';
  };
  reader.readAsText(file,'utf-8');
}

/* ================= 交互层：设置 ================= */
function openSettings(){
  var p=state.profile;
  document.getElementById('set-industry').value=p.industry||'';
  document.getElementById('set-role').value=p.role||'';
  document.getElementById('set-focus').value=(p.focus||[]).join(', ');
  document.getElementById('set-goal').value=p.goal||'';
  document.getElementById('set-dailyCount').value=p.dailyCount||3;
  document.getElementById('set-reviewCycle').value=p.reviewCycle||'daily';
  var form=document.getElementById('settings-form');
  if(!document.getElementById('clear-data-btn')){
    var btn=document.createElement('button');
    btn.type='button';btn.id='clear-data-btn';btn.className='btn btn-danger btn-block btn-sm';
    btn.setAttribute('data-action','clear-data');btn.style.marginTop='14px';btn.textContent='清空全部数据';
    form.appendChild(btn);
  }
  document.getElementById('settings-overlay').classList.add('show');
}
function closeSettings(){document.getElementById('settings-overlay').classList.remove('show')}
function saveSettings(form){
  state.profile={
    industry:form.elements.industry.value.trim(),
    role:form.elements.role.value.trim(),
    focus:parseTags(form.elements.focus.value),
    goal:form.elements.goal.value.trim(),
    dailyCount:Math.max(1,Math.min(8,parseInt(form.elements.dailyCount.value,10)||3)),
    reviewCycle:form.elements.reviewCycle.value
  };
  save();closeSettings();refreshAll();toast('设置已保存');
}
function clearData(){
  askConfirm('⚠️ 危险操作','将清空全部信息、卡片与复盘记录，且无法撤销。建议先导出备份。确定清空吗？',function(){
    var d=seed();
    state.items=[];state.cards=[];state.reviews=[];state.ui.recSeed=0;
    save();closeSettings();refreshAll();toast('已清空，页面已重置为空状态');
  });
}

/* ================= 交互层：动作分发 ================= */
function onAction(action,el,ds){
  var id=ds&&ds.id;
  var item=id?findById(state.items,id):null;
  var card=id?findById(state.cards,id):null;
  switch(action){
    case 'export-json': exportJSON();break;
    case 'import-json': document.getElementById('import-file').click();break;
    case 'import-file': handleImportFile(el);break;
    case 'open-settings': openSettings();break;
    case 'close-settings': closeSettings();break;
    case 'save-settings': saveSettings(el);break;
    case 'clear-data': clearData();break;
    case 'close-editor': closeEditor();break;
    case 'save-editor': saveEditor(el);break;
    case 'editor-delete': deleteEditor();break;
    case 'confirm-cancel': closeConfirm();break;
    case 'confirm-ok': var fn=pendingConfirm;closeConfirm();if(fn)fn();break;
    case 'refresh-recs': state.ui.recSeed=(state.ui.recSeed||0)+1;save();renderRecs();break;
    case 'item-done':
      if(item){item.status='read';item.readAt=today();save();refreshAll();toast('已标记已读')}
      break;
    case 'view-item': if(item)openEditor('item',item.id);break;
    case 'edit-item': if(item)openEditor('item',item.id);break;
    case 'new-item': case 'quick-add': openEditor('item','');break;
    case 'edit-card': if(card)openEditor('card',card.id);break;
    case 'new-card': openEditor('card','');break;
    case 'flip-card': var fc=el.closest('.flashcard');if(fc)fc.classList.toggle('open');break;
    case 'review-card':
      if(card){card.reviews=(card.reviews||0)+1;card.lastReview=today();save();refreshAll();toast('复习 +1')}
      break;
    case 'card-from-item':
      if(item){
        state.cards.unshift({id:uid(),q:item.title,a:item.summary||'',tags:(item.tags||[]).slice(),source:'来自信息流',reviews:0,lastReview:'',createdAt:today()});
        save();refreshAll();toast('已存入认知卡片');
      }
      break;
    case 'new-review': openEditor('review','');break;
    case 'edit-review': var rv=findById(state.reviews,id);if(rv)openEditor('review',rv.id);break;
    case 'tag-filter':
      window._feedSelTag=ds.tag||'';
      onTab('feed');renderFeed();
      break;
    default: break;
  }
}
function findById(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}

/* ESC 关闭浮层 */
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  closeConfirm();closeEditor();closeSettings();
});

/* ---------- 事件委托 ---------- */
document.addEventListener('click',function(e){
  var tabEl=e.target.closest('[data-tab]');if(tabEl){onTab(tabEl.getAttribute('data-tab'));return}
  var kbEl=e.target.closest('[data-kb]');if(kbEl){onKbTab(kbEl.getAttribute('data-kb'));return}
  var actEl=e.target.closest('[data-action]');if(actEl){onAction(actEl.getAttribute('data-action'),actEl,actEl.dataset);return}
  var tagEl=e.target.closest('[data-tag]');if(tagEl){onAction('tag-filter',tagEl,{tag:tagEl.getAttribute('data-tag')});return}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='settings-form'){e.preventDefault();onAction('save-settings',e.target,{});}
  else if(e.target.id==='editor-form'){e.preventDefault();onAction('save-editor',e.target,{});}
});
document.addEventListener('change',function(e){
  if(e.target.id==='feed-type'||e.target.id==='feed-status'){renderFeed()}
  if(e.target.id==='import-file'&&e.target.files&&e.target.files[0]){onAction('import-file',e.target,{})}
});
document.addEventListener('input',function(e){if(e.target.id==='feed-search'){renderFeed()}});
document.getElementById('settings-overlay').addEventListener('click',function(e){if(e.target===this)onAction('close-settings')});
document.getElementById('editor-overlay').addEventListener('click',function(e){if(e.target===this)onAction('close-editor')});
document.getElementById('confirm-overlay').addEventListener('click',function(e){if(e.target===this)onAction('confirm-cancel')});

/* ---------- 初始化 ---------- */
function init(){
  load();
  state.meta.lastOpen=today();save();
  var t=today(),wd=['日','一','二','三','四','五','六'][new Date().getDay()];
  var dt=document.getElementById('today-date');if(dt)dt.textContent=t+' 星期'+wd;
  refreshAll();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();

})();
</script>
</body>
</html>
